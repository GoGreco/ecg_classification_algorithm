[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-classification"
version = "0.1.0"
description = "Reproducible ECG classification research pipeline for MIT-BIH."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imbalanced-learn==0.14.0",
    "matplotlib==3.10.6",
    "neurokit2==0.2.10",
    "numpy==2.3.2",
    "pandas==2.3.2",
    "PyWavelets==1.8.0",
    "scikit-learn==1.7.1",
    "scipy==1.16.1",
    "wfdb==4.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
